name: Build SUMIENIE 3000

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Odtwórz klucz podpisujący
        env:
          KEYSTORE_BASE64: ${{ secrets.SUMIENIE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > sumienie3000-release.jks

      - name: Zbuduj podpisane APK
        env:
          SUMIENIE_KEYSTORE_PASSWORD: ${{ secrets.SUMIENIE_KEYSTORE_PASSWORD }}
          SUMIENIE_KEY_PASSWORD: ${{ secrets.SUMIENIE_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Udostępnij podpisane APK
        uses: actions/upload-artifact@v4
        with:
          name: Sumienie3000-release
          path: app/build/outputs/apk/release/app-release.apk
